# The iOS app. Before generating the project, build the Rust core once:
#   scripts/build-core.sh && xcodegen generate
name: ZeroGridTrail
options:
  bundleIdPrefix: de.zeibig.zerogrid.trail
  deploymentTarget:
    iOS: "16.4"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
  # Valhalla 3.9.1, the version the routing data of the regions is built with.
  ValhallaMobile:
    url: https://github.com/Rallista/valhalla-mobile.git
    exactVersion: 0.6.4
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 29WG4SD523
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # The core is only built for Apple-Silicon simulators (scripts/build-core.sh).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  ZeroGridTrail:
    type: application
    platform: iOS
    sources:
      - ZeroGridTrail
      # The Swift side of the core's bindings, written by scripts/build-core.sh.
      - Generated/outdoor_core.swift
      # Map styles and glyphs are shared with the desktop app.
      - path: ../../styles
        type: folder
        buildPhase: resources
      - path: ../../assets/map/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/OutdoorCore.xcframework
        embed: false
      - package: MapLibre
        product: MapLibre
      - package: ValhallaMobile
        product: Valhalla
    info:
      path: ZeroGridTrail/Info.plist
      properties:
        CFBundleDisplayName: ZeroGrid Trail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocationWhenInUseUsageDescription: Zeigt deine Position auf der Karte, zeichnet Touren auf und führt dich auf der Route.
        # Recording and guidance go on while the screen is locked; the turn hints are spoken there too.
        UIBackgroundModes:
          - location
          - audio
        NSLocalNetworkUsageDescription: Lädt Karten und Routen von ZeroGrid Base im Heimnetz.
        NSCameraUsageDescription: Liest den QR-Code der Freigabe in ZeroGrid Base.
        # The desktop's share is plain HTTP in the home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.zeibig.zerogrid.trail
  ZeroGridTrailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ZeroGridTrailTests
      - path: ../../fixtures/regions/mini
        type: folder
        buildPhase: resources
    dependencies:
      - target: ZeroGridTrail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ZeroGridTrailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ZeroGridTrailUITests
      - path: ../../fixtures/regions/mini
        type: folder
        buildPhase: resources
      - path: ../../fixtures/regions/mini-contours
        type: folder
        buildPhase: resources
      - path: ../../fixtures/gpx/replay
        type: folder
        buildPhase: resources
    dependencies:
      - target: ZeroGridTrail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ZeroGridTrail:
    build:
      targets:
        ZeroGridTrail: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZeroGridTrailTests
        - ZeroGridTrailUITests
