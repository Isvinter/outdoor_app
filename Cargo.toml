[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "apps/base/src-tauri", "apps/sky/src-tauri", "apps/sky/plugins/*"]
# Plain `cargo test` leaves out the Sky app: it is an iOS app, built on the Mac.
default-members = ["crates/*", "tools/*", "apps/base/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
core-track = { path = "crates/core-track" }
region-builder = { path = "crates/region-builder" }
core-app = { path = "crates/core-app" }
core-gpx = { path = "crates/core-gpx" }
core-location = { path = "crates/core-location" }
core-maps = { path = "crates/core-maps" }
core-routing = { path = "crates/core-routing" }
core-storage = { path = "crates/core-storage" }
core-ffi = { path = "crates/core-ffi" }
core-share = { path = "crates/core-share" }
flight-core = { path = "crates/flight-core" }
sensor-bridge = { path = "crates/sensor-bridge" }
sensor-sim = { path = "crates/sensor-sim" }
vario-audio = { path = "crates/vario-audio" }
vario-engine = { path = "crates/vario-engine" }

flate2 = "1.1"
if-addrs = "0.15"
image-webp = "0.2"
png = "0.18"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rayon = "1.12"
sha2 = "0.11"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"
quick-xml = "0.42"
rusqlite = { version = "0.42", features = ["bundled", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = "0.32.2"
uuid = { version = "1.29", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

# The contour tests build whole archives; unoptimised they take a minute.
[profile.dev.package.contour-tiles]
opt-level = 2
[profile.dev.package.core-maps]
opt-level = 2
