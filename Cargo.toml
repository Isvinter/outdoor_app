[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
core-track = { path = "crates/core-track" }
core-gpx = { path = "crates/core-gpx" }

clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"
quick-xml = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
