[package]
name = "core-ffi"
description = "UniFFI wrapper around core-app for the mobile apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "outdoor_core"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
# The binding generator, only needed on the machine that builds the app.
bindgen = ["uniffi/cli"]

[dependencies]
core-app.workspace = true
core-location.workspace = true
core-maps.workspace = true
core-routing.workspace = true
core-storage.workspace = true
uniffi.workspace = true
uuid.workspace = true

[dev-dependencies]
core-share.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Not the workspace lints: the code UniFFI generates needs `unsafe`, and the
# workspace forbids it, which a crate cannot lift locally.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
