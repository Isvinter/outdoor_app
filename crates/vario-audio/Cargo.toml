[package]
name = "vario-audio"
description = "Vario tone synthesis and audio output"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["output"]
# Audio device output through cpal. Without it only the pure synthesizer is built,
# which needs no system audio libraries.
output = ["dep:cpal"]

[dependencies]
flight-core.workspace = true
thiserror.workspace = true
cpal = { version = "0.18", optional = true }

# Sky keeps its own, looser rules; `sensor-bridge` opts out of this one for its C entry point.
[lints.rust]
unsafe_code = "deny"
