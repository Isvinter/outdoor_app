name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages for Tauri and Valhalla
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev \
            clang cmake libboost-dev libprotobuf-dev protobuf-compiler libasound2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend (embedded into the desktop binary)
        working-directory: apps/desktop/ui
        run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude vario-app --exclude tauri-plugin-vario-sensors --all-targets -- -D warnings
      - run: cargo test --workspace --exclude vario-app --exclude tauri-plugin-vario-sensors
      - name: Without the routing engine
        run: cargo test -p core-routing -p core-app

  android-check:
    # The platform independent crates must keep compiling for Android. The bundled
    # SQLite is C code and needs the NDK compiler, which the runner image provides.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            clang: aarch64-linux-android24-clang
          - target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi24-clang
          - target: x86_64-linux-android
            clang: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          triple="$(echo '${{ matrix.target }}' | tr - _)"
          export "CC_${triple}=$bin/${{ matrix.clang }}" "AR_${triple}=$bin/llvm-ar"
          cargo check -p core-track -p core-gpx -p core-location -p core-maps -p core-storage -p core-routing -p core-app -p core-ffi \
            --target ${{ matrix.target }}

  ios-check:
    # Same for iOS; needs Xcode's compiler for SQLite, hence a macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check -p core-track -p core-gpx -p core-location -p core-maps -p core-storage -p core-routing -p core-app -p core-ffi
          --target aarch64-apple-ios
